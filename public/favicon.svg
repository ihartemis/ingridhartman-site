<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
	<!-- Pixel-art ember. Same silhouette + palette as the ship log embers and homepage campfire fire sprite.
	     5 wide x 7 tall, each pixel = 4 SVG units, centered in 32x32. -->

	<!-- Row 0 — . . A . . -->
	<rect x="14" y="2" width="4" height="4" fill="#aa1100"/>

	<!-- Row 1 — . A B A . -->
	<rect x="10" y="6"  width="4" height="4" fill="#aa1100"/>
	<rect x="14" y="6"  width="4" height="4" fill="#ee4422"/>
	<rect x="18" y="6"  width="4" height="4" fill="#aa1100"/>

	<!-- Row 2 — A B C B A -->
	<rect x="6"  y="10" width="4" height="4" fill="#aa1100"/>
	<rect x="10" y="10" width="4" height="4" fill="#ee4422"/>
	<rect x="14" y="10" width="4" height="4" fill="#ffaa00"/>
	<rect x="18" y="10" width="4" height="4" fill="#ee4422"/>
	<rect x="22" y="10" width="4" height="4" fill="#aa1100"/>

	<!-- Row 3 — B C D C B -->
	<rect x="6"  y="14" width="4" height="4" fill="#ee4422"/>
	<rect x="10" y="14" width="4" height="4" fill="#ffaa00"/>
	<rect x="14" y="14" width="4" height="4" fill="#ffdd55"/>
	<rect x="18" y="14" width="4" height="4" fill="#ffaa00"/>
	<rect x="22" y="14" width="4" height="4" fill="#ee4422"/>

	<!-- Row 4 — B C D C B (doubled-core for the molten center) -->
	<rect x="6"  y="18" width="4" height="4" fill="#ee4422"/>
	<rect x="10" y="18" width="4" height="4" fill="#ffaa00"/>
	<rect x="14" y="18" width="4" height="4" fill="#ffdd55"/>
	<rect x="18" y="18" width="4" height="4" fill="#ffaa00"/>
	<rect x="22" y="18" width="4" height="4" fill="#ee4422"/>

	<!-- Row 5 — . B C B . -->
	<rect x="10" y="22" width="4" height="4" fill="#ee4422"/>
	<rect x="14" y="22" width="4" height="4" fill="#ffaa00"/>
	<rect x="18" y="22" width="4" height="4" fill="#ee4422"/>

	<!-- Row 6 — . . B . . -->
	<rect x="14" y="26" width="4" height="4" fill="#ee4422"/>
</svg>
